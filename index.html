<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeměpisný kvíz</title>

            --bg-body: #111827;
            --bg-header: linear-gradient(135deg, #1e3a8a, #3b82f6);
            --text-color: #f9fafb;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --btn-bg: rgba(255, 255, 255, 0.07);
            --btn-hover: rgba(255, 255, 255, 0.15);
        }
        :root[data-theme="light"] {
            --bg-body: #f3f4f6;
            --bg-header: linear-gradient(135deg, #2563eb, #60a5fa);
            --text-color: #1f2937;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --btn-bg: rgba(0, 0, 0, 0.03);
            --btn-hover: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: 0; display: flex; flex-direction: column;
            height: 100vh; background-color: var(--bg-body); color: var(--text-color); overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* VYLEPŠENÉ ÚVODNÍ MENU */
        #menu-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            z-index: 2000; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; color: white;
            padding: 24px 16px; box-sizing: border-box; text-align: center; overflow-y: auto;
        }

        .menu-top-bar {
            width: 100%; max-width: 480px; display: flex; justify-content: flex-end; margin-bottom: 10px;
        }

        #menu-screen h1 { 
            margin: 10px 0 4px 0; font-size: 2.1rem; font-weight: 700; 
            letter-spacing: -0.5px; background: linear-gradient(to right, #60a5fa, #fde047);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        #menu-screen > p { margin: 0 0 20px 0; font-size: 0.95rem; opacity: 0.8; }

        .menu-container {
            width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px;
        }

        .menu-section {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px; border-radius: 20px; width: 100%; box-sizing: border-box;
            backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .menu-section h2 { font-size: 1.05rem; margin: 0 0 10px 0; color: #fde047; text-align: left; display: flex; align-items: center; gap: 8px; }
        
        .category-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        
        .btn-menu {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);
            color: white; padding: 10px 12px; border-radius: 10px; font-size: 0.82rem;
            font-weight: 500; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Plus Jakarta Sans', sans-serif; text-align: left; display: flex; align-items: center; justify-content: space-between;
        }
        .btn-menu::after { content: '›'; opacity: 0.5; font-size: 1rem; transition: transform 0.2s; }
        .btn-menu:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.25); transform: translateY(-1px); }
        .btn-menu:hover::after { opacity: 1; transform: translateX(2px); }
        
        .btn-menu.full { 
            grid-column: 1 / -1; background: linear-gradient(135deg, #f59e0b, #d97706); 
            color: #ffffff; border: none; font-weight: 650; justify-content: center; text-align: center;
        }
        .btn-menu.full::after { display: none; }
        .btn-menu.full:hover { background: linear-gradient(135deg, #fbbf24, #b45309); color: white; }

        .btn-menu.game { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none; 
            width: 100%; margin-top: 4px; justify-content: center; text-align: center; font-weight: 650; font-size: 0.95rem; padding: 12px;
        }
        .btn-menu.game::after { display: none; }
        .btn-menu.game:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }

        #name-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: 3000; display: none;
            align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e293b; color: white; padding: 25px; border-radius: 20px;
            width: 100%; max-width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-content h3 { margin-top: 0; color: #fde047; }
        .modal-content select {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569;
            background: #0f172a; color: white; font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem; margin: 15px 0; outline: none; cursor: pointer;
        }
        .modal-content button {
            background: #2563eb; color: white; border: none; padding: 12px 20px;
            border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.2s;
        }
        .modal-content button:hover { background: #1d4ed8; }

        #header {
            background: var(--bg-header); color: white;
            padding: 10px 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 6px; }
        .header-left, .header-right { display: flex; align-items: center; gap: 5px; }
        .btn-action {
            background: rgba(255, 255, 255, 0.2); border: none; color: white;
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: 600;
            font-size: 0.78rem; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.2s; white-space: nowrap;
        }
        .btn-action:hover { background: rgba(255, 255, 255, 0.35); }
        .btn-hint { background: #f59e0b; }
        .btn-hint:hover { background: #d97706; }
        .header-center { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .header-center h3 { margin: 0; font-weight: 600; font-size: 0.75rem; opacity: 0.9; }
        #target-card { background: rgba(255, 255, 255, 0.15); padding: 3px 12px; border-radius: 50px; backdrop-filter: blur(8px); margin-top: 2px; }
        #target-name { color: #fde047; font-weight: 700; font-size: 0.95rem; }
        .scoreboard { font-size: 0.8rem; font-weight: 500; background: rgba(0, 0, 0, 0.15); padding: 5px 10px; border-radius: 15px; white-space: nowrap; }
        
        #map { flex-grow: 1; width: 100%; }

        #leaderboard-preview {
            font-size: 0.85rem; max-height: 120px; overflow-y: auto; text-align: left; margin-top: 10px;
            padding-right: 2px;
        }
        .lb-item { display: flex; justify-content: space-between; padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); border-radius: 6px; }
        .lb-item:hover { background: rgba(255,255,255,0.04); }
    </style>
</head>
<body>

    <!-- ÚVODNÍ MENU -->
    <div id="menu-screen">
        <div class="menu-top-bar">
            <button class="btn-menu" onclick="toggleTheme()" style="padding: 6px 12px; font-size: 0.8rem; width: auto; justify-content: center;">🌓 Vzhled</button>
        </div>
        
        <h1>🌍 Zeměpisný kvíz</h1>
        <p>Vyber si režim, jak chceš hrát</p>

        <div class="menu-container">
            <!-- SOUTĚŽNÍ REŽIM (dán nahoru, protože je atraktivnější) -->
            <div class="menu-section" style="border-color: rgba(253, 224, 71, 0.2); background: rgba(253, 224, 71, 0.03);">
                <h2>🏆 Soutěžní Game Mode</h2>
                <p style="font-size: 0.78rem; margin: 0 0 10px 0; opacity: 0.75; text-align: left;">60 sekund na čas + zápis do žebříčku třídy.</p>
                <button class="btn-menu game" onclick="startCompetitionGame()">Spustit soutěž 🚀</button>
                
                <div id="leaderboard-preview">
                    <div style="text-align: center; opacity: 0.7; padding: 10px;">Načítám žebříček...</div>
                </div>
            </div>

            <!-- POHODOVÝ REŽIM -->
            <div class="menu-section">
                <h2>☕ Pohodový režim</h2>
                <div class="category-grid">
                    <button class="btn-menu" onclick="startRelaxGame('Oceány a moře')">Oceány a moře</button>
                    <button class="btn-menu" onclick="startRelaxGame('Poloostrovy')">Poloostrovy</button>
                    <button class="btn-menu" onclick="startRelaxGame('Ostrovy')">Ostrovy</button>
                    <button class="btn-menu" onclick="startRelaxGame('Zálivy a průlivy')">Zálivy a průlivy</button>

                    <button class="btn-menu full" onclick="startRelaxGame('Vše')">🌟 Všechna místa dohromady</button>
                </div>
            </div>
        </div>
    </div>

        let currentMode = null;
        let activePlaces = [], remainingPlaces = [], current = null, score = 0;
        let timeLeft = 60, timerInterval = null, gameRunning = false;

        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles &copy; Esri' }).addTo(map);

        const menuScreen = document.getElementById('menu-screen');
        const headerElem = document.getElementById('header');
        const targetNameElem = document.getElementById('target-name');
        const scoreElem = document.getElementById('score');
        const scoreDisplay = document.getElementById('score-display');
        const nameModal = document.getElementById('name-modal');
        const skipBtn = document.getElementById('skip-btn');

        loadLeaderboardPreview();

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startRelaxGame(category) {
            currentMode = 'relax';
            activePlaces = category === 'Vše' ? [...allPlaces] : allPlaces.filter(p => p.type === category);
            remainingPlaces = [...activePlaces];
            shuffleArray(remainingPlaces);

            menuScreen.style.display = 'none';
            headerElem.style.display = 'flex';
            skipBtn.style.display = 'inline-block';
            
            score = 0;
            scoreElem.innerText = score;
            scoreDisplay.innerHTML = `Skóre: <span id="score" style="font-weight: 700; color: #fde047;">0</span>`;
            
            map.invalidateSize();
            nextQuestion();
        }

        function startCompetitionGame() {
            currentMode = 'competition';
            activePlaces = [...allPlaces];
            
            menuScreen.style.display = 'none';
            headerElem.style.display = 'flex';
            skipBtn.style.display = 'none';
            
            score = 0;
            timeLeft = 60;
            gameRunning = true;
            scoreElem.innerText = score;
            scoreDisplay.innerHTML = `⏱️ <span id="timer">60</span>s | Skóre: <span id="score" style="color: #fde047;">0</span>`;

            map.invalidateSize();
            nextQuestion();

            timerInterval = setInterval(() => {
                timeLeft--;
                const timerElem = document.getElementById('timer');
                if (timerElem) timerElem.innerText = timeLeft;
                if (timeLeft <= 0) {
                    endCompetitionGame();
                }
            }, 1000);
        }

        function returnToMenu() {
            if (timerInterval) clearInterval(timerInterval);
            gameRunning = false;
            nameModal.style.display = 'none';
            menuScreen.style.display = 'flex';
            headerElem.style.display = 'none';
            loadLeaderboardPreview();
        }

        function nextQuestion() {
            if (currentMode === 'relax') {
                if (remainingPlaces.length === 0) {
                    alert("Prošel/a jsi všechna místa v této kategorii! Začínáme znovu.");
                    remainingPlaces = [...activePlaces];
                    shuffleArray(remainingPlaces);
                }
                current = remainingPlaces.pop();
                targetNameElem.innerText = current.name;
            } else if (currentMode === 'competition' && gameRunning) {
                const index = Math.floor(Math.random() * activePlaces.length);
                current = activePlaces[index];
                targetNameElem.innerText = current.name;
            }
        }

        function showHint() { 
            if (current && current.hint) alert(`💡 Nápověda: ${current.hint}`); 
        }

        function skipQuestion() {
            if (!current) return;
            alert(`Správná odpověď byla: ${current.name}. Ukazuji na mapě.`);
            L.marker([current.lat, current.lng]).addTo(map).bindPopup(`<b>${current.name}</b>`).openPopup();
            nextQuestion();
        }

        function endCompetitionGame() {
            clearInterval(timerInterval);
            gameRunning = false;
            document.getElementById('final-score-val').innerText = score;
            document.getElementById('student-name-select').value = "";
            nameModal.style.display = 'flex';
        }

        function submitScore() {
            const selectElem = document.getElementById('student-name-select');
            const playerName = selectElem.value;

            if (!playerName) {
                alert("Prosím, vyber ze seznamu své jméno!");
                return;
            }

            fetch(SHEETDB_API, {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: [{ name: playerName, score: score }] })
            }).then(() => {
                returnToMenu();
            }).catch(() => {
                alert("Chyba při ukládání skóre do tabulky.");
                returnToMenu();
            });
        }

        function loadLeaderboardPreview() {
            fetch(SHEETDB_API)
                .then(res => res.json())
                .then(data => {
                    const lbDiv = document.getElementById('leaderboard-preview');
                    if (!data || data.length === 0) {
                        lbDiv.innerHTML = "<div style='text-align:center; opacity:0.7; padding:10px;'>Zatím žádné výsledky.</div>";
                        return;
                    }
                    data.sort((a, b) => parseInt(b.score) - parseInt(a.score));
                    let html = "<div style='font-weight:600; margin-bottom:6px; color:#fde047; font-size:0.85rem;'>🏆 Nejlepší výsledky třídy:</div>";
                    for (let i = 0; i < Math.min(3, data.length); i++) {
                        html += `<div class="lb-item"><span>${i+1}. ${data[i].name}</span> <b>${data[i].score} b</b></div>`;
                    }
                    lbDiv.innerHTML = html;
                }).catch(() => {
                    document.getElementById('leaderboard-preview').innerHTML = "<div style='text-align:center; opacity:0.7; padding:10px;'>Žebříček se nepodařilo načíst.</div>";
                });
        }

        map.on('click', function(e) {
            if (menuScreen.style.display !== 'none' || nameModal.style.display === 'flex' || !current) return;
            
            if (Math.abs(e.latlng.lat - current.lat) <= current.radius && Math.abs(e.latlng.lng - current.lng) <= current.radius) {
                score++;
                document.getElementById('score').innerText = score;
                L.marker([current.lat, current.lng]).addTo(map).bindPopup(`<b>${current.name}</b>`).openPopup();
                nextQuestion();
            } else {
                if (currentMode === 'relax') {
                    alert("Bohužel vedle!");
                }
            }
        });
