<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeměpisný kvíz - S nápovědou a češtinou</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f3f4f6;
        }
        /* Úvodní menu obrazovka */
        #menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #menu-screen h1 {
            margin-bottom: 10px;
            font-size: 2rem;
        }
        #menu-screen p {
            margin-bottom: 30px;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }
        .btn-category {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-category:hover {
            background: white;
            color: #1e3a8a;
            transform: translateY(-2px);
        }
        .btn-category.all {
            grid-column: 1 / -1;
            background: #fde047;
            color: #1e3a8a;
            border-color: #facc15;
        }
        .btn-category.all:hover {
            background: #facc15;
        }

        /* Herní hlavička */
        #header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 12px 20px;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
            z-index: 1000;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .btn-hint {
            background: #f59e0b;
        }
        .btn-hint:hover {
            background: #d97706;
        }
        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        h2 {
            margin: 0;
            font-weight: 600;
            font-size: 0.95rem;
            opacity: 0.9;
        }
        #target-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 16px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            margin-top: 4px;
        }
        #target-name {
            color: #fde047;
            font-weight: 700;
            font-size: 1rem;
        }
        #scoreboard {
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 16px;
            padding: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>Zeměpisný kvíz</h1>
        <p>Vyber si kategorii, kterou chceš procvičovat:</p>
        <div class="category-grid">
            <button class="btn-category" onclick="startGame('Oceán')">Oceány a moře</button>
            <button class="btn-category" onclick="startGame('Poloostrov')">Poloostrovy</button>
            <button class="btn-category" onclick="startGame('Ostrov')">Ostrovy</button>
            <button class="btn-category" onclick="startGame('Záliv')">Zálivy a průlivy</button>
            <button class="btn-category" onclick="startGame('Pohoří')">Pohoří a hory</button>
            <button class="btn-category" onclick="startGame('Řeka')">Řeky</button>
            <button class="btn-category" onclick="startGame('Jezero')">Jezera</button>
            <button class="btn-category all" onclick="startGame('Vše')">🌟 Hrát všechno dohromady</button>
        </div>
    </div>

    <div id="header" style="display: none;">
        <div class="header-left">
            <button class="btn-action" onclick="returnToMenu()">← Menu</button>
        </div>
        <div class="header-center">
            <h2>Hledá se:</h2>
            <div id="target-card">
                <span id="target-name">Načítám...</span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-action btn-hint" onclick="showHint()">💡 Nápověda</button>
            <button class="btn-action" onclick="skipQuestion()">Další ➡️</button>
            <div id="scoreboard">Skóre: <span id="score" style="font-weight: 700; color: #fde047;">0</span></div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const allPlaces = [
            // --- Oceány a moře ---
            { name: "Sev. led. oceán", type: "Oceán", lat: 80.0, lng: 0.0, radius: 18, hint: "Nejmenší ze světových oceánů, nachází se kolem severního pólu." },
            { name: "Tichý oceán", type: "Oceán", lat: 0.0, lng: -160.0, radius: 25, hint: "Největší a nejhlubší oceán na Zemi." },
            { name: "Atlantský oceán", type: "Oceán", lat: 0.0, lng: -30.0, radius: 22, hint: "Druhý největší oceán, odděluje Ameriku od Evropy a Afriky." },
            { name: "Indický oceán", type: "Oceán", lat: -20.0, lng: 80.0, radius: 22, hint: "Třetí největší oceán, leží jižně od Asie." },
            { name: "Jižní led. oceán", type: "Oceán", lat: -65.0, lng: 0.0, radius: 18, hint: "Obklopuje Antarktidu." },
            { name: "Jaderské moře", type: "Moře", lat: 43.0, lng: 15.0, radius: 8, hint: "Oblíbené moře Čechů pro dovolenou, severní část Středozemního moře." },
            { name: "Černé moře", type: "Moře", lat: 43.4, lng: 34.0, radius: 9, hint: "Leží mezi východní Evropou a západní Asií, vlévá se do něj Dunaj." },
            { name: "Středozemní moře", type: "Moře", lat: 35.0, lng: 18.0, radius: 12, hint: "Obklopené Evropou, Afrikou a Asií, spojuje ho s Atlantikem Gibraltar." },
            { name: "Baltické moře", type: "Moře", lat: 57.0, lng: 20.0, radius: 9, hint: "Vnitrozemské moře v severní Evropě (Moravskoslezský kraj ho nemá, ale Česko do jeho úmoří patří)." },
            { name: "Severní moře", type: "Moře", lat: 56.0, lng: 3.0, radius: 9, hint: "Leží mezi Velkou Británií a Skandinávií, známé těžbou ropy." },
            { name: "Rudé moře", type: "Moře", lat: 22.0, lng: 38.0, radius: 9, hint: "Mezi Afrikou a Arabským poloostrovem, velmi slané a teplé." },

            // --- Poloostrovy ---
            { name: "Skandinávský poloostrov", type: "Poloostrov", lat: 63.0, lng: 14.0, radius: 10, hint: "Nachází se na něm Norsko a Švédsko." },
            { name: "Pyrenejský poloostrov", type: "Poloostrov", lat: 40.0, lng: -4.0, radius: 9, hint: "Leží na něm Španělsko a Portugalsko." },
            { name: "Apeninský poloostrov", type: "Poloostrov", lat: 42.0, lng: 12.5, radius: 8, hint: "Má tvar italské boty." },
            { name: "Balkánský poloostrov", type: "Poloostrov", lat: 42.0, lng: 22.0, radius: 9, hint: "Jihovýchodní Evropa, státy jako Řecko, Bulharsko, Chorvatsko." },
            { name: "Arabský poloostrov", type: "Poloostrov", lat: 24.0, lng: 45.0, radius: 10, hint: "Největší poloostrov světa, známý pouštěmi a ropou." },
            { name: "Přední Indie", type: "Poloostrov", lat: 20.0, lng: 78.0, radius: 10, hint: "Velký poloostrov v jižní Asii, kde leží stát Indie." },
            { name: "Korejský poloostrov", type: "Poloostrov", lat: 36.0, lng: 128.0, radius: 8, hint: "Rozdělený na Severní a Jižní Koreu." },
            { name: "Aljaška", type: "Poloostrov", lat: 64.0, lng: -152.0, radius: 10, hint: "Největší stát USA, na severozápadě Ameriky." },
            { name: "Florida", type: "Poloostrov", lat: 28.0, lng: -81.5, radius: 8, hint: "Slunný poloostrov USA s městem Miami a krokodýly." },

            // --- Ostrovy ---
            { name: "Britské ostrovy", type: "Ostrov", lat: 54.0, lng: -3.0, radius: 9, hint: "Zahrnují Anglii, Skotsko, Wales a Irsko." },
            { name: "Island", type: "Ostrov", lat: 64.9, lng: -19.0, radius: 8, hint: "Ostrov ohně a ledu, gejzírů a sopek v severním Atlantiku." },
            { name: "Madagaskar", type: "Ostrov", lat: -20.0, lng: 47.0, radius: 9, hint: "Velký ostrov u východního pobřeží Afriky, domov lemurů." },
            { name: "Kuba", type: "Ostrov", lat: 21.5, lng: -78.0, radius: 8, hint: "Největší ostrov v Karibském moři." },
            { name: "Grónsko (Kanadské ostrovy)", type: "Ostrov", lat: 75.0, lng: -100.0, radius: 12, hint: "Největší ostrov světa (patří Dánsku, leží u Ameriky)." },
            { name: "Japonsko (Hokkaidó)", type: "Ostrov", lat: 43.3, lng: 142.8, radius: 8, hint: "Severní ostrov japonského souostroví." },
            { name: "Nový Zéland", type: "Ostrov", lat: -41.0, lng: 174.0, radius: 9, hint: "Ostrovní stát v Tichém oceánu jižně od Austrálie." },

            // --- Zálivy a průlivy ---
            { name: "Mexický záliv", type: "Záliv", lat: 25.0, lng: -90.0, radius: 9, hint: "Záliv v Severní Americe, ohraničený USA, Mexikem a Kubou." },
            { name: "Bengálský záliv", type: "Záliv", lat: 15.0, lng: 88.0, radius: 9, hint: "Největší záliv na světě, v Indickém oceánu u Indie." },
            { name: "Gibraltarský průliv", type: "Průliv", lat: 35.9, lng: -5.3, radius: 8, hint: "Úzký průliv spojující Středozemní moře a Atlantik." },
            { name: "Panamský průplav", type: "Průplav", lat: 9.1, lng: -79.6, radius: 8, hint: "Umožňuje lodím proplout z Atlantiku do Tichého oceánu v Americe." },
            { name: "Suezský průplav", type: "Průplav", lat: 30.5, lng: 32.3, radius: 8, hint: "Umělý průplav v Egyptě spojující Středozemní a Rudé moře." },

            // --- Pohoří a hory ---
            { name: "Himaláje (Mt. Everest)", type: "Pohoří", lat: 27.9, lng: 86.9, radius: 8, hint: "Nejvyšší pohoří světa s nejvyšší horou planety." },
            { name: "Kavkaz (Elbrus)", type: "Pohoří", lat: 43.3, lng: 42.4, radius: 8, hint: "Pohoří mezi Černým a Kaspickým mořem." },
            { name: "Ural", type: "Pohoří", lat: 60.0, lng: 60.0, radius: 10, hint: "Tradiční hranice mezi Evropou a Asií v Rusku." },
            { name: "Alpy (Mt. Blanc)", type: "Pohoří", lat: 45.8, lng: 6.8, radius: 8, hint: "Slavné evropské velespohoří zasahující do Francie, Itálie, Švýcarska..." },
            { name: "Andy (Aconcagua)", type: "Pohoří", lat: -32.6, lng: -70.0, radius: 10, hint: "Nejdelší kontinentální pohoří na západě Jižní Ameriky." },
            { name: "Skalnaté hory", type: "Pohoří", lat: 45.0, lng: -110.0, radius: 10, hint: "Významné pohoří v západní části Severní Ameriky." },
            { name: "Atlas", type: "Pohoří", lat: 31.5, lng: -6.0, radius: 9, hint: "Pohoří v severozápadní Africe." },

            // --- Řeky ---
            { name: "Volha", type: "Řeka", lat: 46.5, lng: 48.5, radius: 9, hint: "Nejdelší evropská řeka, protéká Ruskem do Kaspického moře." },
            { name: "Dunaj", type: "Řeka", lat: 45.2, lng: 29.6, radius: 9, hint: "Druhá nejdelší evropská řeka, protéká Vídní, Budapeští i Bělehradem." },
            { name: "Labe", type: "Řeka", lat: 53.8, lng: 8.7, radius: 8, hint: "Naše hlavní řeka, pramení v Krkonoších a vlévá se do Severního moře." },
            { name: "Nil", type: "Řeka", lat: 30.1, lng: 31.1, radius: 10, hint: "Tradičně považovaná za nejdelší řeku světa, protéká Egyptem." },
            { name: "Amazonka", type: "Řeka", lat: -0.1, lng: -50.0, radius: 10, hint: "Vodnatějších řeku na světě nenajdeš, protéká Jižní Amerikou." },
            { name: "Mississippi", type: "Řeka", lat: 29.1, lng: -89.2, radius: 9, hint: "Hlavní říční systém v USA." },
            { name: "Kongo", type: "Řeka", lat: -6.0, lng: 12.4, radius: 9, hint: "Nejvodnatější řeka Afriky." },

            // --- Jezera ---
            { name: "Kaspické moře (Jezero)", type: "Jezero", lat: 42.0, lng: 50.0, radius: 10, hint: "Největší vnitrozemské jezero (nebo vnitrozemské moře) na světě." },
            { name: "Bajkal", type: "Jezero", lat: 53.5, lng: 108.1, radius: 8, hint: "Nejhlubší jezero světa, leží na Sibiři." },
            { name: "Viktoriino jezero", type: "Jezero", lat: -1.0, lng: 33.0, radius: 8, hint: "Největší jezero v Africe, pramen Bílého Nilu." },
            { name: "Titicaca", type: "Jezero", lat: -15.8, lng: -69.3, radius: 8, hint: "Nejvýše položené velkoploché jezero světa v Andách." },
            { name: "Hořejší jezero", type: "Jezero", lat: 47.7, lng: -87.5, radius: 8, hint: "Největší z amerických Velkých jezer." }
        ];

        let activePlaces = [];
        let currentIndex = 0;
        let score = 0;

        const map = L.map('map').setView([20, 0], 2);

        // MAPA V ČEŠTINĚ: Používáme dlaždice s českými popiskami (ArcGIS World Street Map nebo CartoDB s podporou jazyků)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        const targetNameElem = document.getElementById('target-name');
        const scoreElem = document.getElementById('score');
        const menuScreen = document.getElementById('menu-screen');
        const headerElem = document.getElementById('header');

        function startGame(category) {
            if (category === 'Vše') {
                activePlaces = [...allPlaces];
            } else {
                activePlaces = allPlaces.filter(p => p.type === category);
            }

            if (activePlaces.length === 0) {
                alert("V této kategorii nejsou žádná místa.");
                return;
            }

            menuScreen.style.display = 'none';
            headerElem.style.display = 'flex';
            
            score = 0;
            scoreElem.innerText = score;
            map.invalidateSize();
            nextQuestion();
        }

        function returnToMenu() {
            menuScreen.style.display = 'flex';
            headerElem.style.display = 'none';
        }

        function nextQuestion() {
            currentIndex = Math.floor(Math.random() * activePlaces.length);
            const current = activePlaces[currentIndex];
            targetNameElem.innerText = `${current.name}`;
        }

        function showHint() {
            const current = activePlaces[currentIndex];
            alert(`💡 Nápověda: ${current.hint}`);
        }

        function skipQuestion() {
            const current = activePlaces[currentIndex];
            alert(`Nevadí! Správná odpověď byla: ${current.name}. Ukazuji na mapě.`);
            
            L.marker([current.lat, current.lng]).addTo(map)
                .bindPopup(`<b>${current.type}: ${current.name}</b>`)
                .openPopup();

            nextQuestion();
        }

        map.on('click', function(e) {
            if (menuScreen.style.display === 'flex') return;

            const clickedLat = e.latlng.lat;
            const clickedLng = e.latlng.lng;
            
            const target = activePlaces[currentIndex];

            const latDiff = Math.abs(clickedLat - target.lat);
            const lngDiff = Math.abs(clickedLng - target.lng);

            if (latDiff <= target.radius && lngDiff <= target.radius) {
                alert(`Správně! Našel/a jsi: ${target.name}.`);
                score++;
                scoreElem.innerText = score;
                
                L.marker([target.lat, target.lng]).addTo(map)
                    .bindPopup(`<b>${target.type}: ${target.name}</b>`)
                    .openPopup();

                nextQuestion();
            } else {
                alert(`Bohužel vedle! Zkus to znovu nebo použij nápovědu.`);
            }
        });
    </script>

</body>
</html>
