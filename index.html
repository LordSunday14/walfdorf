        #map {

        .leaflet-popup-content-wrapper {

            padding: 5px;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

            attribution: '© OpenStreetMap přispěvatelé'
        }).addTo(map);

        const targetNameElem = document.getElementById('target-name');
        const scoreElem = document.getElementById('score');

        function nextQuestion() {
            currentIndex = Math.floor(Math.random() * places.length);
            const current = places[currentIndex];
            targetNameElem.innerText = `${current.type}: ${current.name}`;
        }

        map.on('click', function(e) {
            const clickedLat = e.latlng.lat;
            const clickedLng = e.latlng.lng;
            
            const target = places[currentIndex];

            const latDiff = Math.abs(clickedLat - target.lat);
            const lngDiff = Math.abs(clickedLng - target.lng);

            if (latDiff <= target.radius && lngDiff <= target.radius) {
                alert(`Správně! Našel/a jsi ${target.type}: ${target.name}.`);
                score++;
                scoreElem.innerText = score;
                
                L.marker([target.lat, target.lng]).addTo(map)
                    .bindPopup(`<b>${target.type}: ${target.name}</b>`)
                    .openPopup();

                nextQuestion();
            } else {
                alert(`Bohužel vedle! Zkus hledat lépe.`);
            }
        });
