    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f3f4f6;
        }
        /* Úvodní menu obrazovka */
        #menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #menu-screen h1 {
            margin-bottom: 10px;
            font-size: 2rem;
        }
        #menu-screen p {
            margin-bottom: 30px;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }
        .btn-category {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-category:hover {
            background: white;
            color: #1e3a8a;
            transform: translateY(-2px);
        }
        .btn-category.all {
            grid-column: 1 / -1;
            background: #fde047;
            color: #1e3a8a;
            border-color: #facc15;
        }
        .btn-category.all:hover {
            background: #facc15;
        }

        /* Herní hlavička */
        #header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
            z-index: 1000;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        h2 {
            margin: 0;
            font-weight: 600;
            font-size: 1.1rem;
        }
        #target-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 16px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            margin-top: 4px;
        }
        #target-name {
            color: #fde047;
            font-weight: 700;
            font-size: 1rem;
        }
        #scoreboard {
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 16px;
            padding: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

            score = 0;
            scoreElem.innerText = score;
            map.invalidateSize();
            nextQuestion();
        }

        function returnToMenu() {
            // Spolehlivě zobrazí menu zpět a schová hlavičku
            menuScreen.style.display = 'flex';
            headerElem.style.display = 'none';
        }

        function nextQuestion() {
            currentIndex = Math.floor(Math.random() * activePlaces.length);
            const current = activePlaces[currentIndex];
            targetNameElem.innerText = `${current.name}`;
        }

        map.on('click', function(e) {
            // Pokud je menu zobrazené, ignoruj kliknutí do mapy
            if (menuScreen.style.display === 'flex') return;

            const clickedLat = e.latlng.lat;
            const clickedLng = e.latlng.lng;
            
            const target = activePlaces[currentIndex];

            const latDiff = Math.abs(clickedLat - target.lat);
            const lngDiff = Math.abs(clickedLng - target.lng);

            if (latDiff <= target.radius && lngDiff <= target.radius) {
                alert(`Správně! Našel/a jsi: ${target.name}.`);
                score++;
                scoreElem.innerText = score;
                
                L.marker([target.lat, target.lng]).addTo(map)
                    .bindPopup(`<b>${target.type}: ${target.name}</b>`)
                    .openPopup();

                nextQuestion();
            } else {
                alert(`Bohužel vedle! Zkus hledat lépe.`);
            }
        });
    </script>

</body>
</html>
