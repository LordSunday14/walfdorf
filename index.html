<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeměpisný kvíz</title>
    <!-- Načtení stylů pro Leaflet mapu -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts pro moderní a čistý font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f3f4f6;
            overflow: hidden;
        }
        /* Úvodní menu obrazovka */
        #menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            overflow-y: auto;
        }
        #menu-screen h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        #menu-screen p {
            margin-bottom: 20px;
            font-size: 1rem;
            opacity: 0.9;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 500px;
        }
        .btn-category {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-category:hover {
            background: white;
            color: #1e3a8a;
            transform: translateY(-2px);
        }
        .btn-category.all {
            grid-column: 1 / -1;
            background: #fde047;
            color: #1e3a8a;
            border-color: #facc15;
        }
        .btn-category.all:hover {
            background: #facc15;
        }

        /* Herní hlavička - optimalizovaná pro mobily */
        #header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 10px 12px;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
            z-index: 1000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 6px;
        }
        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .btn-hint {
            background: #f59e0b;
        }
        .btn-hint:hover {
            background: #d97706;
        }
        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        h2 {
            margin: 0;
            font-weight: 600;
            font-size: 0.8rem;
            opacity: 0.9;
        }
        #target-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 12px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            margin-top: 2px;
        }
        #target-name {
            color: #fde047;
            font-weight: 700;
            font-size: 0.95rem;
        }
        #scoreboard {
            font-size: 0.8rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.15);
            padding: 5px 10px;
            border-radius: 15px;
            white-space: nowrap;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Úvodní menu -->
    <div id="menu-screen">
        <h1>Zeměpisný kvíz</h1>
        <p>Vyber si kategorii, kterou chceš procvičovat:</p>
        <div class="category-grid">
            <button class="btn-category" onclick="startGame('Oceán')">Oceány a moře</button>
            <button class="btn-category" onclick="startGame('Poloostrov')">Poloostrovy</button>
            <button class="btn-category" onclick="startGame('Ostrov')">Ostrovy</button>
            <button class="btn-category" onclick="startGame('Záliv')">Zálivy a průlivy</button>
            <button class="btn-category" onclick="startGame('Pohoří')">Pohoří a hory</button>
            <button class="btn-category" onclick="startGame('Řeka')">Řeky</button>
            <button class="btn-category" onclick="startGame('Jezero')">Jezera</button>
            <button class="btn-category all" onclick="startGame('Vše')">🌟 Hrát všechno dohromady</button>
        </div>
    </div>

    <!-- Herní rozhraní -->
    <div id="header" style="display: none;">
        <div class="header-row">
            <div class="header-left">
                <button class="btn-action" onclick="returnToMenu()">← Menu</button>
            </div>
            <div class="header-center">
                <h2>Hledá se:</h2>
                <div id="target-card">
                    <span id="target-name">Načítám...</span>
                </div>
            </div>
            <div class="header-right">
                <div id="scoreboard">Skóre: <span id="score" style="font-weight: 700; color: #fde047;">0</span></div>
            </div>
        </div>
        <div class="header-row" style="justify-content: center; gap: 10px;">
            <button class="btn-action btn-hint" onclick="showHint()">💡 Nápověda</button>
            <button class="btn-action" onclick="skipQuestion()">Další ➡️</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- Načtení knihovny Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const allPlaces = [
            // --- Oceány a moře ---
            { name: "Sev. led. oceán", type: "Oceán", lat: 80.0, lng: 0.0, radius: 18, hint: "Kolem severního pólu" },
            { name: "Tichý oceán", type: "Oceán", lat: 0.0, lng: -160.0, radius: 25, hint: "Mezi Amerikou, Asií a Austrálií" },
            { name: "Atlantský oceán", type: "Oceán", lat: 0.0, lng: -30.0, radius: 22, hint: "Mezi Evropou, Afrikou a Amerikou" },
            { name: "Indický oceán", type: "Oceán", lat: -20.0, lng: 80.0, radius: 22, hint: "Jižně od Asie, mezi Afrikou a Austrálií" },
            { name: "Jižní led. oceán", type: "Oceán", lat: -65.0, lng: 0.0, radius: 18, hint: "Kolem Antarktidy" },
            { name: "Jaderské moře", type: "Moře", lat: 43.0, lng: 15.0, radius: 8, hint: "Itálie, Chorvatsko, Slovinsko, Albánie" },
            { name: "Černé moře", type: "Moře", lat: 43.4, lng: 34.0, radius: 9, hint: "Turecko, Ukrajina, Rusko, Rumunsko, Bulharsko, Gruzie" },
            { name: "Středozemní moře", type: "Moře", lat: 35.0, lng: 18.0, radius: 12, hint: "Mezi jižní Evropou a severní Afrikou" },
            { name: "Baltické moře", type: "Moře", lat: 57.0, lng: 20.0, radius: 9, hint: "Švédsko, Finsko, Polsko, pobaltské státy, Německo" },
            { name: "Severní moře", type: "Moře", lat: 56.0, lng: 3.0, radius: 9, hint: "Velká Británie, Norsko, Dánsko, Německo, Nizozemsko" },
            { name: "Rudé moře", type: "Moře", lat: 22.0, lng: 38.0, radius: 9, hint: "Egypt, Súdán, Saúdská Arábie, Jemen" },

            // --- Poloostrovy ---
            { name: "Skandinávský poloostrov", type: "Poloostrov", lat: 63.0, lng: 14.0, radius: 10, hint: "Norsko, Švédsko, sever Finska" },
            { name: "Pyrenejský poloostrov", type: "Poloostrov", lat: 40.0, lng: -4.0, radius: 9, hint: "Španělsko, Portugalsko" },
            { name: "Apeninský poloostrov", type: "Poloostrov", lat: 42.0, lng: 12.5, radius: 8, hint: "Itálie" },
            { name: "Balkánský poloostrov", type: "Poloostrov", lat: 42.0, lng: 22.0, radius: 9, hint: "Řecko, Chorvatsko, Bulharsko, Srbsko atd." },
            { name: "Arabský poloostrov", type: "Poloostrov", lat: 24.0, lng: 45.0, radius: 10, hint: "Saúdská Arábie, Jemen, Omán, Spojené arabské emiráty" },
            { name: "Přední Indie", type: "Poloostrov", lat: 20.0, lng: 78.0, radius: 10, hint: "Indie" },
            { name: "Korejský poloostrov", type: "Poloostrov", lat: 36.0, lng: 128.0, radius: 8, hint: "Severní Korea, Jižní Korea" },
            { name: "Aljaška", type: "Poloostrov", lat: 64.0, lng: -152.0, radius: 10, hint: "USA" },
            { name: "Florida", type: "Poloostrov", lat: 28.0, lng: -81.5, radius: 8, hint: "USA" },

            // --- Ostrovy ---
            { name: "Britské ostrovy", type: "Ostrov", lat: 54.0, lng: -3.0, radius: 9, hint: "Spojené království, Irsko" },
            { name: "Island", type: "Ostrov", lat: 64.9, lng: -19.0, radius: 8, hint: "Island" },
            { name: "Madagaskar", type: "Ostrov", lat: -20.0, lng: 47.0, radius: 9, hint: "Madagaskar" },
            { name: "Kuba", type: "Ostrov", lat: 21.5, lng: -78.0, radius: 8, hint: "Kuba" },
            { name: "Grónsko (Kanadské ostrovy)", type: "Ostrov", lat: 75.0, lng: -100.0, radius: 12, hint: "Grónsko (Dánsko), Kanada" },
            { name: "Japonsko (Hokkaidó)", type: "Ostrov", lat: 43.3, lng: 142.8, radius: 8, hint: "Japonsko" },
            { name: "Nový Zéland", type: "Ostrov", lat: -41.0, lng: 174.0, radius: 9, hint: "Nový Zéland" },

            // --- Zálivy a průlivy ---
            { name: "Mexický záliv", type: "Záliv", lat: 25.0, lng: -90.0, radius: 9, hint: "Pobřeží USA, Mexika a Kuby" },
            { name: "Bengálský záliv", type: "Záliv", lat: 15.0, lng: 88.0, radius: 9, hint: "Východně od Indie, u Bangladéše a Myanmaru" },
            { name: "Gibraltarský průliv", type: "Průliv", lat: 35.9, lng: -5.3, radius: 8, hint: "Mezi Španělskem a Marokem" },
            { name: "Panamský průplav", type: "Průplav", lat: 9.1, lng: -79.6, radius: 8, hint: "Panama" },
            { name: "Suezský průplav", type: "Průplav", lat: 30.5, lng: 32.3, radius: 8, hint: "Egypt" },

            // --- Pohoří a hory ---
            { name: "Himaláje (Mt. Everest)", type: "Pohoří", lat: 27.9, lng: 86.9, radius: 8, hint: "Nepál, Čína (Tibet), Indie, Pákistán" },
            { name: "Kavkaz (Elbrus)", type: "Pohoří", lat: 43.3, lng: 42.4, radius: 8, hint: "Rusko, Gruzie, Ázerbájdžán, Arménie" },
            { name: "Ural", type: "Pohoří", lat: 60.0, lng: 60.0, radius: 10, hint: "Rusko" },
            { name: "Alpy (Mt. Blanc)", type: "Pohoří", lat: 45.8, lng: 6.8, radius: 8, hint: "Francie, Itálie, Švýcarsko, Rakousko, Německo" },
            { name: "Andy (Aconcagua)", type: "Pohoří", lat: -32.6, lng: -70.0, radius: 10, hint: "Argentina, Chile, Peru, Bolívie, Ekvádor, Kolumbie" },
            { name: "Skalnaté hory", type: "Pohoří", lat: 45.0, lng: -110.0, radius: 10, hint: "USA, Kanada" },
            { name: "Atlas", type: "Pohoří", lat: 31.5, lng: -6.0, radius: 9, hint: "Maroko, Alžírsko, Tunisko" },

            // --- Řeky ---
            { name: "Volha", type: "Řeka", lat: 46.5, lng: 48.5, radius: 9, hint: "Rusko" },
            { name: "Dunaj", type: "Řeka", lat: 45.2, lng: 29.6, radius: 9, hint: "Německo, Rakousko, Slovensko, Maďarsko, Rumunsko atd." },
            { name: "Labe", type: "Řeka", lat: 53.8, lng: 8.7, radius: 8, hint: "Česko, Německo" },
            { name: "Nil", type: "Řeka", lat: 30.1, lng: 31.1, radius: 10, hint: "Egypt, Súdán, Uganda, Etiopie" },
            { name: "Amazonka", type: "Řeka", lat: -0.1, lng: -50.0, radius: 10, hint: "Brazílie, Peru, Kolumbie" },
            { name: "Mississippi", type: "Řeka", lat: 29.1, lng: -89.2, radius: 9, hint: "USA" },
            { name: "Kongo", type: "Řeka", lat: -6.0, lng: 12.4, radius: 9, hint: "Demokratická republika Kongo, Konžská republika" },

            // --- Jezera ---
            { name: "Kaspické moře (Jezero)", type: "Jezero", lat: 42.0, lng: 50.0, radius: 10, hint: "Rusko, Kazachstán, Turkmenistán, Írán, Ázerbájdžán" },
            { name: "Bajkal", type: "Jezero", lat: 53.5, lng: 108.1, radius: 8, hint: "Rusko (Sibiř)" },
            { name: "Viktoriino jezero", type: "Jezero", lat: -1.0, lng: 33.0, radius: 8, hint: "Tanzanie, Uganda, Keňa" },
            { name: "Titicaca", type: "Jezero", lat: -15.8, lng: -69.3, radius: 8, hint: "Peru, Bolívie" },
            { name: "Hořejší jezero", type: "Jezero", lat: 47.7, lng: -87.5, radius: 8, hint: "USA, Kanada" }
        ];

        let activePlaces = [];
        let currentIndex = 0;
        let score = 0;

        const map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        const targetNameElem = document.getElementById('target-name');
        const scoreElem = document.getElementById('score');
        const menuScreen = document.getElementById('menu-screen');
        const headerElem = document.getElementById('header');

        function startGame(category) {
            if (category === 'Vše') {
                activePlaces = [...allPlaces];
            } else {
                activePlaces = allPlaces.filter(p => p.type === category);
            }

            if (activePlaces.length === 0) {
                alert("V této kategorii nejsou žádná místa.");
                return;
            }

            menuScreen.style.display = 'none';
            headerElem.style.display = 'flex';
            
            score = 0;
            scoreElem.innerText = score;
            map.invalidateSize();
            nextQuestion();
        }

        function returnToMenu() {
            menuScreen.style.display = 'flex';
            headerElem.style.display = 'none';
        }

        function nextQuestion() {
            currentIndex = Math.floor(Math.random() * activePlaces.length);
            const current = activePlaces[currentIndex];
            targetNameElem.innerText = `${current.name}`;
        }

        function showHint() {
            const current = activePlaces[currentIndex];
            alert(`💡 Nápověda: ${current.hint}`);
        }

        function skipQuestion() {
            const current = activePlaces[currentIndex];
            alert(`Nevadí! Správná odpověď byla: ${current.name}. Ukazuji na mapě.`);
            
            L.marker([current.lat, current.lng]).addTo(map)
                .bindPopup(`<b>${current.type}: ${current.name}</b>`)
                .openPopup();

            nextQuestion();
        }

        map.on('click', function(e) {
            if (menuScreen.style.display === 'flex') return;

            const clickedLat = e.latlng.lat;
            const clickedLng = e.latlng.lng;
            
            const target = activePlaces[currentIndex];

            const latDiff = Math.abs(clickedLat - target.lat);
            const lngDiff = Math.abs(clickedLng - target.lng);

            if (latDiff <= target.radius && lngDiff <= target.radius) {
                alert(`Správně! Našel/a jsi: ${target.name}.`);
                score++;
                scoreElem.innerText = score;
                
                L.marker([target.lat, target.lng]).addTo(map)
                    .bindPopup(`<b>${target.type}: ${target.name}</b>`)
                    .openPopup();

                nextQuestion();
            } else {
                alert(`Bohužel vedle! Zkus to znovu nebo použij nápovědu.`);
            }
        });
    </script>

</body>
</html>
